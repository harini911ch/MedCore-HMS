# ==========================================
# MedCore HMS - Application Configuration
# ==========================================

# Server
server.port=8081


# ==========================================
# PostgreSQL Database
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5433/medcore
spring.datasource.username=medcore
spring.datasource.password=medcore_password
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Temporary security debugging
logging.level.org.springframework.security=DEBUG