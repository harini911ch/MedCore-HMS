services:
  postgres:
    image: postgres:16-alpine
    container_name: medcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medcore
      POSTGRES_PASSWORD: medcore_password
      POSTGRES_DB: medcore
    ports:
      - "5433:5432"
    volumes:
      - medcore_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: medcore-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - medcore_redis_data:/data

volumes:
  medcore_postgres_data:
  medcore_redis_data: